server.port=8080
spring.datasource.url=${DB_URL:jdbc:sqlite:data/licenses.db?busy_timeout=5000}
# SQLite allows a single writer; one pooled connection avoids "database is locked" errors
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.storage-path=license-storage
app.key-path=keys
app.jwt-secret=ChangeThisDevelopmentSecretToAtLeastThirtyTwoCharacters12345
